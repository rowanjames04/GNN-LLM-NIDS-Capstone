# Phase 2 preprocessing for NF-ToN-IoT-v2 (primary dataset, D19).
#
# Deliberately near-identical to configs/preprocess.yaml. The NF-v2 schema is
# shared (D1), so adopting a second dataset costs configuration rather than
# code -- the same pipeline, metric suite and graph builder run unchanged.

dataset_config: configs/dataset_toniot.yaml

# Rows loaded, as whole parquet row groups (loader.py). Part of the experiment:
# the splits, the zero-day gates and every result depend on it. Was a
# command-line flag (--max-rows 6000000) until 2026-10-17.
max_rows: 6000000
eda_metrics: results/metrics/eda_NF-ToN-IoT-v2.json

features:
  # NOT shortcuts on this dataset -- the audit measured MIN_TTL at 0.6585 and
  # MIN_IP_PKT_LEN at 0.7038 here, against 0.9942 and 0.9884 on
  # NF-UNSW-NB15-v2. The leak was that capture's, not the feature set's.
  #
  # They are dropped anyway, because cross-dataset transfer (Phase 9) requires
  # both datasets to expose an identical feature vector. Using the intersection
  # keeps every result comparable and keeps the NF-UNSW-NB15-v2 numbers clean.
  # The cost here is small and is stated in the report rather than hidden.
  drop_shortcuts:
    - MIN_TTL
    - MAX_TTL
    - MIN_IP_PKT_LEN

  drop_uninformative:
    - DNS_QUERY_ID      # transaction identifier, no generalisable signal
    - ICMP_IPV4_TYPE    # duplicate of ICMP_TYPE by definition

  # D47 (2026-10-17): recording artefacts, not measurements. On both datasets
  # FLOW_DURATION_MILLISECONDS is either exactly 0 or a 32-bit wrap (2^32/1000
  # minus a small gap), and DURATION_IN/OUT are non-zero only in wrapped rows,
  # so the three carry no genuine timing at all. The wrap is concentrated in
  # particular families (72% of NF-ToN-IoT-v2 ddos, ~3% of benign) and would be
  # learned as a fingerprint. The four rate columns are computed from the same
  # broken interval in wrapped rows. Imputing them was rejected: a constant
  # placed in the wrapped rows is itself a marker of those rows.
  # Evidence: results/metrics/data_quality_<dataset>.json.
  drop_artefacts:
    - FLOW_DURATION_MILLISECONDS
    - DURATION_IN
    - DURATION_OUT
    - SRC_TO_DST_SECOND_BYTES
    - DST_TO_SRC_SECOND_BYTES
    - SRC_TO_DST_AVG_THROUGHPUT
    - DST_TO_SRC_AVG_THROUGHPUT

  identity:
    - IPV4_SRC_ADDR
    - IPV4_DST_ADDR

  categorical:
    - PROTOCOL
    - L7_PROTO
    - TCP_FLAGS
    - CLIENT_TCP_FLAGS
    - SERVER_TCP_FLAGS
  categorical_min_frequency: 0.001
  categorical_max_cardinality: 64

  conditional:
    - ICMP_TYPE
    - DNS_QUERY_TYPE
    - DNS_TTL_ANSWER
    - FTP_COMMAND_RET_CODE

  ports:
    - L4_SRC_PORT
    - L4_DST_PORT

  log_transform: from_eda
  scaler: standard

split:
  method: window_random   # D5 contiguous is unsafe here -- see splits.window_split
  train: 0.70
  val: 0.10
  test: 0.20
  purge_gap: 10000
  fit_on: train

graph:
  window: fixed_count
  # Held at 10,000 for comparability with NF-UNSW-NB15-v2, but re-sweep: this
  # graph is completely different (29,245 hosts against 44), so the window size
  # that maximises structural variation is very unlikely to be the same.
  window_size: 10000
  # Extended past 100,000: on the first run fan-out spread was still
  # climbing at that point (17.32 -> 19.00 -> 23.73 -> 28.96), unlike
  # NF-UNSW-NB15-v2 where it peaked at 10,000 and fell away.
  window_sizes_to_sweep: [10000, 50000, 100000, 200000, 400000]
  directed: true
  multigraph: true
  node_identity: ip
  global_node_map: true

# D20: the dataset stays at its published 63.99% attack rate. Downsampling
# attack FLOWS would destroy the topology this dataset was adopted for -- a
# scanner reaching 5,161 peers keeps ~155 at 3% sampling. If compute forces a
# smaller set, drop whole WINDOWS so each retained window stays structurally
# intact. Null means use everything.
subsample_windows: null

output:
  dir: data/processed/toniot
  stats: results/metrics/preprocess_NF-ToN-IoT-v2.json
  seed: 42
