# Phase 7: the LLM layer. See Obsidian "05 - LLM Layer".

# `stub` by default -- deterministic, offline, free, and the control arm of the
# study rather than only a test double. A real model that scores no better than
# a template on groundedness is not adding anything, and having that floor makes
# the claim checkable. Every other provider costs money or needs a local server
# and must be requested explicitly on the command line.
provider: stub

# Versioned because the study measures PROMPTS as well as models (the
# prompt-sensitivity ablation). Every generated report records the version that
# produced it; editing a prompt without bumping the version silently invalidates
# every comparison made before the edit.
prompt_version: v1

packs: results/evidence/evidence_NF-ToN-IoT-v2.json
n_reports: 200          # the stratified sample size in the study design

# The roster for the fully crossed study: every enabled entry sees every pack,
# through the same prompt. Disable rather than delete, so the record shows what
# was considered.
#
# D43 (2026-10-11): the study is SELF-HOSTED ONLY. The use case is a security
# team that will not send detection evidence to a third-party model API, so the
# models compared are open-weight models the team could run itself. The cloud
# entries are disabled, not deleted: the adapters and their tests stay, and the
# record shows they were considered. No cloud call was ever made.
#
# `billing` decides what the spend gate guards, and `--only` selects arms by it:
#   paid         real money per call; refused without --confirm-spend
#   free_tier    no charge on a free-tier key (D36)
#   self_hosted  weights on hardware we run (D35: Ollama on Google Colab)
# An entry with no `billing` is treated as paid. Guessing "free" is the error
# that costs money.
#
# The whole study runs inside Colab:  --only stub self_hosted
roster:
  - {provider: stub, billing: free, enabled: true}          # control arm; deterministic
  # D43: disabled. Sending evidence packs to a vendor API is the thing the
  # project's use case rules out.
  - {provider: anthropic, model: claude-opus-5, billing: paid, enabled: false}
  - {provider: anthropic, model: claude-haiku-4-5, billing: paid, enabled: false}
  - {provider: openai, model: gpt-4o, billing: paid, enabled: false}        # D36
  - {provider: gemini, model: gemini-3.8-flash, billing: free_tier, enabled: false}
  # D43: four open-weight families, all of which fit a free Colab GPU at 4-bit
  # (Obsidian: "Model Quantisation"), plus one same-family size pair
  # (qwen2.5 7b against 14b) for the tiered-model question the Claude pair used
  # to answer. Tags move when a model is re-published, so each run records the
  # pulled digest -- quote that, not the tag. All six tags below were checked
  # against the Ollama registry on 2026-10-11.
  - {provider: ollama, model: "llama3.1:8b", billing: self_hosted, enabled: true}       # Meta
  - {provider: ollama, model: "qwen2.5:7b", billing: self_hosted, enabled: true}        # Alibaba, small tier
  - {provider: ollama, model: "qwen2.5:14b", billing: self_hosted, enabled: true}       # Alibaba, large tier
  - {provider: ollama, model: "gemma3:12b", billing: self_hosted, enabled: true}        # Google
  - {provider: ollama, model: "mistral-nemo:12b", billing: self_hosted, enabled: true}  # Mistral
  # A fifth family, held back for Colab time. Enabling it is this edit.
  - {provider: ollama, model: "phi4:14b", billing: self_hosted, enabled: false}         # Microsoft

# Determinism is requested uniformly here and each adapter applies what its
# provider actually supports, recording the rest as unsupported. The study
# design's original wording -- "all models at temperature 0 with a fixed seed" --
# is not achievable in 2026: sampling controls were removed on the current
# Claude generation and passing them returns a 400. Asserting a control that
# cannot be applied would be worse than reporting the asymmetry, so the
# asymmetry is reported per response.
provider_options:
  stub: {}
  anthropic:
    model: claude-opus-5
    max_tokens: 2000
    temperature: 0        # dropped for models that reject it; recorded as unsupported
    seed: 42
  openai:
    model: gpt-4o
    max_tokens: 2000
    temperature: 0
    seed: 42
  gemini:
    model: gemini-3.8-flash
    max_tokens: 2000
    # Gemini accepts both, unlike current Claude models. See the determinism
    # note in the study design.
    temperature: 0
    seed: 42
    # Free-tier limits are per account and per model, shown in AI Studio
    # (aistudio.google.com/rate-limit), not published. 6 s spacing = 10 requests
    # a minute; lower it only if AI Studio shows a higher limit. 429s are retried
    # with backoff anyway, and a daily quota stops the run for a later resume.
    min_interval_seconds: 6
    max_retries: 5
    backoff_seconds: 10
  ollama:
    # D35: served by Ollama inside a Google Colab GPU runtime and reached over
    # localhost from the same notebook (notebooks/colab_self_hosted_arm.ipynb).
    # iHPC is decommissioned and Cetus was abandoned after UTS eResearch did not
    # reply; Colab was Dr Altaf's suggestion (15/09/2026).
    model: "llama3.1:8b"
    temperature: 0
    seed: 42
    # Pinned rather than left to Ollama's default, because Ollama TRUNCATES a
    # prompt longer than its context window instead of raising. Prompts measured
    # at ~500-700 tokens (2026-09-15) plus a report of up to ~2,000 fit easily;
    # the headroom is for a future few-shot prompt version.
    num_ctx: 8192

smoke:
  packs: results/evidence/smoke_evidence_NF-ToN-IoT-v2.json
  n_reports: 2

output:
  dir: results/reports
