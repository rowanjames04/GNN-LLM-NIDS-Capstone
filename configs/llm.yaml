# Phase 7: the LLM layer. See Obsidian "05 - LLM Layer".

# `stub` by default -- deterministic, offline, free, and the control arm of the
# study rather than only a test double. A real model that scores no better than
# a template on groundedness is not adding anything, and having that floor makes
# the claim checkable. Every other provider costs money or needs a local server
# and must be requested explicitly on the command line.
provider: stub

# Versioned because the study measures PROMPTS as well as models (the
# prompt-sensitivity ablation). Every generated report records the version that
# produced it; editing a prompt without bumping the version silently invalidates
# every comparison made before the edit.
prompt_version: v3   # D49: the facts layer. v1/v2 kept for the archived round 1

packs: results/evidence/evidence_NF-ToN-IoT-v2.json
n_reports: 200          # the stratified sample size in the study design

# D46: packs go through every model a round at a time, in a balanced order, so a
# run that stops early (free credit, a rate limit) leaves the same packs done
# for every model. 40 packs is about 4 per attack family and 6 false positives.
round_size: 40

# D50: models run concurrently within a round, at most this many at once. The
# Pro plan allows 3 concurrent requests and each model's run is sequential, so 3
# models at a time is 3 requests. Rounds stay balanced: the next round starts
# only when every model has finished this one.
parallel: 3

# The roster for the fully crossed study: every enabled entry sees every pack,
# through the same prompt. Disable rather than delete, so the record shows what
# was considered.
#
# D44 (2026-10-12): the study runs on OLLAMA'S HOSTED SERVICE. Open-weight
# models only (D43 stands on that point), but served by ollama.com, not by
# hardware we run: a free Colab GPU has the same 16 GB as the Mac, and Rowan
# chose larger models over keeping the run in-house. Consequences recorded in
# the Decision Register: the evidence packs are sent to a third-party API and
# the serving hardware is not disclosed.
#
# D45 (2026-10-12): the first six models ran on FREE usage credits. D50
# (2026-10-18): the account is on the Pro plan, so all hosted entries are
# `paid` and need --confirm-spend.
#
# `billing` decides what the spend gate guards, and `--only` selects arms by it:
#   paid         real money per call; refused without --confirm-spend
#   free_tier    no charge on a free-tier key (D36)
#   self_hosted  weights on hardware we run (D35, D43)
# An entry with no `billing` is treated as paid. Guessing "free" is the error
# that costs money.
#
# The study runs from the Mac:
#   set -a; source .env; set +a          # OLLAMA_API_KEY
#   python scripts/run_llm_study.py --only ollama
roster:
  - {provider: stub, billing: free, enabled: true}          # control arm; deterministic
  # D43: disabled. Closed-weight vendor models are out of scope.
  - {provider: anthropic, model: claude-opus-5, billing: paid, enabled: false}
  - {provider: anthropic, model: claude-haiku-4-5, billing: paid, enabled: false}
  - {provider: openai, model: gpt-4o, billing: paid, enabled: false}        # D36
  - {provider: gemini, model: gemini-3.8-flash, billing: free_tier, enabled: false}
  # D45: the first six (free credits), 2026-10-12. D50 (2026-10-18): Rowan took
  # the Pro plan, so every hosted call now draws on the plan's usage credit and
  # every hosted entry is `paid` -- the spend gate applies to all of them.
  # Names, sizes and quantisation are as ollama.com/api/show returned them with
  # this account's key; each run records them again with the digest.
  - {provider: ollama, model: "gpt-oss:20b", billing: paid, enabled: true}          # OpenAI, 21B, MXFP4
  - {provider: ollama, model: "gpt-oss:120b", billing: paid, enabled: true}         # OpenAI, 117B, MXFP4
  - {provider: ollama, model: "gemma4:31b", billing: paid, enabled: true}           # Google, 33B, BF16
  - {provider: ollama, model: "nemotron-3-nano:30b", billing: paid, enabled: true}  # NVIDIA, 32B, FP8
  - {provider: ollama, model: "nemotron-3-super", billing: paid, enabled: true}     # NVIDIA, 120B, NVFP4
  - {provider: ollama, model: "nemotron-3-ultra", billing: paid, enabled: true}     # NVIDIA, 550B, quantisation not reported
  # D50: three large models from developers not yet in the roster, to test
  # whether "the models are indistinguishable as translators" holds at the
  # frontier. glm-5.3 replaces kimi-k3 (Rowan, 2026-10-18; kimi-k3 is ~3x the
  # cost). No official Qwen model is in the hosted catalogue (qwen3.5:397b was
  # retired 2026-09-25); community re-uploads are excluded (unknown provenance,
  # possible baked-in system prompts).
  # `max_packs` caps one prompt version for one model (D51): on v4 this model
  # reasoned to the 65,536-token output limit without answering on 13 of its
  # first 38 packs (2% on v3). 40 balanced packs establish that; 200 would
  # spend ~$18 of credit repeating it.
  - {provider: ollama, model: "deepseek-v4-pro:0813", billing: paid, enabled: true, max_packs: {v4: 40}}  # DeepSeek, 1.65T, FP8
  - {provider: ollama, model: "glm-5.3", billing: paid, enabled: true}               # Zhipu, 753B, FP8
  - {provider: ollama, model: "mistral-large-4", billing: paid, enabled: true}       # Mistral, 1.05T
  # Considered for a tenth slot; enabling one is this edit.
  - {provider: ollama, model: "minimax-m3", billing: paid, enabled: false}           # MiniMax
  - {provider: ollama, model: "kimi-k2.6", billing: paid, enabled: false}            # Moonshot, 1.04T, INT4
  - {provider: ollama, model: "kimi-k3", billing: paid, enabled: false}              # Moonshot, 2.8T -- replaced by glm-5.3
  - {provider: ollama, model: "mistral-large-3:675b", billing: paid, enabled: false}     # Mistral, 675B, FP8
  - {provider: ollama, model: "deepseek-v4.1-flash", billing: paid, enabled: false}      # DeepSeek, 763B, FP8
  # D43's roster, for a local or Colab Ollama server. Not in the hosted
  # catalogue. Running these needs `host` removed from provider_options.ollama.
  - {provider: ollama, model: "llama3.1:8b", billing: self_hosted, enabled: false}
  - {provider: ollama, model: "qwen2.5:7b", billing: self_hosted, enabled: false}
  - {provider: ollama, model: "qwen2.5:14b", billing: self_hosted, enabled: false}
  - {provider: ollama, model: "gemma3:12b", billing: self_hosted, enabled: false}
  - {provider: ollama, model: "mistral-nemo:12b", billing: self_hosted, enabled: false}
  - {provider: ollama, model: "phi4:14b", billing: self_hosted, enabled: false}

# Determinism is requested uniformly here and each adapter applies what its
# provider actually supports, recording the rest as unsupported. The study
# design's original wording -- "all models at temperature 0 with a fixed seed" --
# is not achievable in 2026: sampling controls were removed on the current
# Claude generation and passing them returns a 400. Asserting a control that
# cannot be applied would be worse than reporting the asymmetry, so the
# asymmetry is reported per response.
provider_options:
  stub: {}
  anthropic:
    model: claude-opus-5
    max_tokens: 2000
    temperature: 0        # dropped for models that reject it; recorded as unsupported
    seed: 42
  openai:
    model: gpt-4o
    max_tokens: 2000
    temperature: 0
    seed: 42
  gemini:
    model: gemini-3.8-flash
    max_tokens: 2000
    # Gemini accepts both, unlike current Claude models. See the determinism
    # note in the study design.
    temperature: 0
    seed: 42
    # Free-tier limits are per account and per model, shown in AI Studio
    # (aistudio.google.com/rate-limit), not published. 6 s spacing = 10 requests
    # a minute; lower it only if AI Studio shows a higher limit. 429s are retried
    # with backoff anyway, and a daily quota stops the run for a later resume.
    min_interval_seconds: 6
    max_retries: 5
    backoff_seconds: 10
  ollama:
    # D44: Ollama's hosted service. The key is read from the environment
    # variable named here; nothing loads .env automatically. Remove `host` to
    # use a local server instead (D35, D43).
    host: https://ollama.com
    api_key_env: OLLAMA_API_KEY
    model: "gpt-oss:20b"
    # Sent on every call and recorded as REQUESTED. A local server honours all
    # three; the hosted service does not document whether it does. Check on the
    # pilot: run the same pack twice and compare.
    temperature: 0
    seed: 42
    # A local server truncates a prompt longer than its context window instead
    # of raising. Prompts measured at ~500-700 tokens (2026-09-15).
    num_ctx: 8192

smoke:
  packs: results/evidence/smoke_evidence_NF-ToN-IoT-v2.json
  n_reports: 2

output:
  dir: results/reports
